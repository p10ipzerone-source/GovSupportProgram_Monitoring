name: 공고 수집

on:
  schedule:
    # KST 08:00 ~ 20:00, 2시간마다 (UTC 기준 23,1,3,5,7,9,11시)
    - cron: "7 23,1,3,5,7,9,11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Scrape
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: python scraper.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json debug/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
