<!DOCTYPE html>

<title>중소기업혁신바우처플랫폼</title>

<style>
	html {font-size: 62.5%;}
	.new-intro * {margin: 0; padding: 0; list-style: none; box-sizing: border-box;}
	.new-intro {font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; display: flex; align-items: center; position: relative; width: 100%; height: 100%; min-height: 100dvh; background: radial-gradient(circle at 18% 16%, rgba(81, 145, 255, .38), transparent 34%), radial-gradient(circle at 82% 82%, rgba(84, 204, 191, .28), transparent 32%), linear-gradient(135deg, #eaf2ff 0%, #f7fbff 45%, #e8f7f4 100%);}	
	.new-intro .intro-wrap {position: absolute; top: 50%; left: 50%; min-width: 30rem; max-width: 65.4rem; width: 94%; padding-top: 5.9rem; background-color: #fff; transform: translate(-50%, -50%); border-radius: 2rem; overflow: hidden;}
	.new-intro .intro-inner {display: grid; grid-row-gap: 5.5rem; width: 100%;}
	
	.new-intro .intro-top-wrap {display: grid; grid-row-gap: 5rem;}
	.new-intro .intro-top-wrap .intro-header {display: grid; justify-content: center; align-items: center; grid-row-gap: 3.6rem; min-height: 4.6rem;}
	.new-intro .intro-top-wrap .intro-header .logo {height: 100%;}
	.new-intro .intro-top-wrap .intro-header .logo img {height: 100%;}
	.new-intro .intro-top-wrap .intro-section {display: grid; grid-row-gap: 3.6rem;}
	.new-intro .intro-top-wrap .intro-section .time-box {display: flex; flex-direction: column; align-items: center; justify-content: center; grid-row-gap: 2.4rem; padding: 0 2rem; font-size: 1.7rem;}
	.new-intro .intro-top-wrap .intro-section .time-box .blue-bg {display: flex; flex-direction: column; justify-content: center; align-items: center; grid-row-gap: 1.6rem; width: 100%; max-width: 52.2rem; min-height: 16.7rem; background-color: #EDF3FF; border-radius: 2rem; font-weight: 700;}
	.new-intro .intro-top-wrap .intro-section .time-box .blue-bg .txt-blue {color: #246BEB;}
	.new-intro .intro-top-wrap .intro-section .time-box .blue-bg .txt-blue .time {margin-left: 1rem;}
	.new-intro .intro-top-wrap .intro-section .time-box .blue-bg .time-img {height: 5.8rem;}
	.new-intro .intro-top-wrap .intro-section .time-box .blue-bg .time-img img {height: 100%;}
	.new-intro .intro-top-wrap .intro-section .time-box .desc {text-align: center; font-weight: 400; line-height: 1.5; color: #2d2d2d;}
	.new-intro .intro-top-wrap .intro-section .time-box .desc .cnt {font-weight: 700;}
	.new-intro .intro-top-wrap .intro-section .desc-box {display: grid;}
	.new-intro .intro-top-wrap .intro-section .desc-box .desc {display: flex; justify-content: center; align-items: center; min-height: 4.4rem; padding: 0.8rem 1.6rem; font-size: 1.5rem; font-weight: 400; line-height: 1.4; color: #4B4B4B;}
	.new-intro .intro-top-wrap .intro-section .desc-box .blue {background-color: #246BEB; color: #fff; font-weight: 200;}
	.new-intro .intro-top-wrap .intro-section .desc-box .blue span {position: relative;}
	.new-intro .intro-top-wrap .intro-section .desc-box .blue span::before {content: ''; position: absolute; top: 0.3rem; left: -3rem; width: 1.7rem; min-height: 1.3rem; background: url(img/ico_arrow_left.v2.svg) no-repeat 100%;}
	.new-intro .intro-top-wrap .intro-section .desc-box .blue span::after {content: ''; position: absolute; top: 0.3rem; right: -3rem; width: 1.7rem; min-height: 1.3rem; background: url(img/ico_arrow_right.v2.svg) no-repeat 100%;}
	
	.new-intro .intro-footer {min-height: 9.6rem; background-color: #25334A;}
	.new-intro .voucher-business {display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, auto)); grid-column-gap: 5rem; grid-row-gap: 1.6rem; height: 100%; padding: 2rem 3.6rem 3.2rem;}
	.new-intro .voucher-business li {display: grid; justify-content: center; align-items: center; position: relative; font-size: 1.5rem; color: #fff;}
	.new-intro .voucher-business li:not(:last-of-type)::after {content: ''; position: absolute; top: 0.3rem; right: -2.5rem; width: 0.1rem; min-height: 4rem; background-color: #556077;}
	.new-intro .voucher-business .list {display: grid; grid-row-gap: 0.8rem;}
	.new-intro .voucher-business .list .tit {font-weight: 500;}
	.new-intro .voucher-business .list .category {font-weight: 200;}
	
</style>
</head>

<body>
<div id="wrapper" style="display: none;">
	 <div class="new-intro">
	 	<div class="intro-wrap">
	 		<div class="intro-inner">
	 			<div class="intro-top-wrap">
					<header class="intro-header">
						<h1 class="logo"><img src="img/img_logo.v2.png" alt="중소기업 혁신바우처 플랫폼" width="292" height="46"></h1>
					</header>
					<section class="intro-section">
						<div class="time-box">
							<div class="blue-bg">
								<span class="time-img"><img src="img/ico_time.v2.svg" alt="" width="58" height="58"></span>
								<span class="txt-blue" id="waitTimer"></span>
							</div>
							<p class="desc" id="comment"></p>
						</div>
						<div class="desc-box">
							<p class="desc blue"><span>잠시만 기다리시면 서비스로 자동 접속되오니 양해하여 주시기 바랍니다.</span></p>
							<p class="desc">* 접속순서대로 서비스가 제공됨에 따라 재접속하면 대기시간이 길어집니다.</p>
						</div>
					</section>
	 			</div>
	 			<footer class="intro-footer">
	 				<ul class="voucher-business">
	 					<li>
	 						<dl class="list">
	 							<dt class="tit">일반바우처 사업</dt>
	 							<dd class="category">
	 								<span>컨설팅</span>
	 								<span>기술지원</span>
	 								<span>마케팅</span>
	 							</dd>
	 						</dl>
	 					</li>
	 					<li>
	 						<dl class="list">
	 							<dt class="tit">탄소중립 경영혁신 바우처사업</dt>
	 							<dd class="category">
	 								<span>컨설팅(탄소)</span>
	 								<span>기술지원(탄소)</span>
	 							</dd>
	 						</dl>
	 					</li>
	 					<li>
	 						<dl class="list">
	 							<dt class="tit">재기 컨설팅 바우처 사업</dt>
	 							<dd class="category">
	 								<span>진로제시</span>
	 								<span>회생컨설팅</span>
	 							</dd>
	 						</dl>
	 					</li>
	 				</ul>
	 			</footer>
	 		</div>
	 	</div>
	 </div>
</div>
</body>

</html>
