<script>
  (function(){try{var t=JSON.parse(localStorage.getItem("spm_theme"));if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#f6f7f9; --card:#fff; --ink:#191c21; --sub:#5d6470; --line:#e3e6eb; --input:#fff;
    --accent:#2f5bea; --accent-soft:#e8eefe; --primary:#2f5bea; --on-primary:#fff;
    --red:#d93636; --red-soft:#fdecec; --amber:#b86e00; --amber-soft:#fff3df; --green:#1d8a4e; --green-soft:#e5f5ec;
    --na-bg:#fafafa; --na-ink:#9aa0a8; --sel-bg:#f5f8ff; --folder-bg:#f1ecfd; --folder-ink:#6a3fc8; --note-ink:#6b4e16;
    --hover:rgba(0,0,0,.06); --shadow:0 10px 30px rgba(0,0,0,.15); --link:#2f5bea;
    --bulk-bg:#191c21; --bulk-ink:#fff; --bulk-line:#555;
  }
  :root[data-theme=dark]{
    color-scheme:dark;
    --bg:#121418; --card:#1b1e24; --ink:#e6e8ec; --sub:#9aa1ad; --line:#2e323a; --input:#14161a;
    --accent:#7c97ff; --accent-soft:#232c48; --primary:#4c6ef0; --on-primary:#fff;
    --red:#ff8585; --red-soft:#3b2225; --amber:#f2b860; --amber-soft:#382c19; --green:#62d49c; --green-soft:#1a3327;
    --na-bg:#17191e; --na-ink:#6c727d; --sel-bg:#1c2540; --folder-bg:#2c2443; --folder-ink:#c7adff; --note-ink:#f1d59c;
    --hover:rgba(255,255,255,.08); --shadow:0 10px 30px rgba(0,0,0,.55); --link:#8fa8ff;
    --bulk-bg:#2a3870; --bulk-ink:#fff; --bulk-line:#5767a3;
  }
  a{color:var(--link)}
  ::placeholder{color:var(--sub);opacity:.8}
  *{box-sizing:border-box}
  body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  .top{max-width:1200px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:700}
  .upd{color:var(--sub);font-size:13px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;color:var(--ink)}
  button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  button.ghost{border-color:transparent;background:transparent;color:var(--sub);padding:4px 8px}
  button.ghost:hover{background:var(--hover)}
  button:disabled{opacity:.5;cursor:default}
  nav{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:10px 16px 0}
  nav button{border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--sub);font-weight:600}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
  nav .cnt{font-size:12px;background:var(--bg);border-radius:10px;padding:1px 7px;margin-left:4px}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .layout{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
  aside.side{position:sticky;top:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 130px);overflow:auto}
  .side .sh{font-size:12px;color:var(--sub);padding:4px 8px 6px;font-weight:600}
  .side .fd{border:none;justify-content:space-between;text-align:left;width:100%;padding:8px 10px;border-radius:7px;border:1px dashed transparent}
  .side .fd:hover{background:var(--hover)}
  .side .fd.on{background:var(--accent-soft);color:var(--accent);font-weight:600;border-color:transparent}
  .side .fd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .fd.add{color:var(--sub);border-color:var(--line);margin-top:6px;justify-content:center}
  .side .fd.drop{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
  .side .hint{font-size:11.5px;color:var(--sub);padding:8px 8px 2px;line-height:1.4}
  .item[draggable=true]{cursor:grab}
  .fav{width:16px;height:16px;border-radius:3px;vertical-align:-3px;margin-right:6px;flex-shrink:0}
  nav .fav{margin-right:6px}
  .srcIco .fav{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
  .srcBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .srcBtn{display:inline-flex;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--ink);text-decoration:none;background:var(--card)}
  .srcBtn:hover{border-color:var(--accent);color:var(--accent)}
  .srcBtn .fav{width:14px;height:14px;margin-right:5px;vertical-align:0}
  .emo,.iconBtn,.picker .grid button,.themeBtn{font-family:Tossface,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;line-height:1}
  .b.folder .emo{margin-right:3px}
  .iconBtn{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:4px;border-radius:5px;cursor:pointer;flex-shrink:0;border:none;background:transparent;padding:0;font-size:15px}
  .iconBtn:hover{background:var(--hover)}
  .iconBtn.big{width:36px;height:36px;font-size:24px;margin:0}
  .side .fd span{display:flex;align-items:center}
  .picker{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:316px;color:var(--ink)}
  .picker .grp{font-size:11.5px;color:var(--sub);margin:6px 2px 4px;font-weight:600}
  .picker .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
  .picker .grid button{border:none;background:transparent;font-size:20px;padding:3px 0;border-radius:6px}
  .picker .grid button:hover{background:var(--hover)}
  .picker .row{display:flex;gap:6px;margin-top:8px}
  .picker .row input{flex:1;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0;background:var(--input);color:var(--ink)}
  .picker .row button{font-size:12.5px;padding:5px 9px}
  .item.dragging{opacity:.4}
  .side .fd[data-fdrag]{cursor:grab}
  .side .fd.ins-before{box-shadow:inset 0 2px 0 var(--accent)}
  .side .fd.ins-after{box-shadow:inset 0 -2px 0 var(--accent)}
  .side .fd.fdragging{opacity:.4}
  .themeBtn{padding:6px 10px}
  @media (max-width:760px){
    .layout{grid-template-columns:1fr}
    aside.side{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}
    .side .sh,.side .hint{display:none}
    .side .fd{width:auto}
  }
  .folders{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .fd{border-radius:8px;padding:6px 12px;font-size:13.5px;display:flex;gap:6px;align-items:center}
  .fd.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .fd small{opacity:.7}
  .fd.add{border-style:dashed;color:var(--sub)}
  .fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .fhead h2{font-size:16px;margin:0}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  select,input[type=search]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--input);color:var(--ink)}
  input[type=search]{min-width:180px;flex:1}
  label.tg{font-size:13px;color:var(--sub);display:flex;gap:4px;align-items:center;white-space:nowrap}
  .banner{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
  .item .body{flex:1;min-width:0}
  .item a.t{font-weight:600;line-height:1.4;color:inherit;text-decoration:none}
  .item a.t:hover{color:var(--accent);text-decoration:underline}
  .item.na{background:var(--na-bg)}
  .item.sel-on{border-color:var(--accent);background:var(--sel-bg)}
  .item .sel{width:17px;height:17px;margin:8px 0 0;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .bulk{position:sticky;top:104px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bulk-bg);color:var(--bulk-ink);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}
  .bulk select{font-size:13px;padding:5px 8px}
  .bulk button{font-size:13px;padding:5px 10px;background:transparent;color:var(--bulk-ink);border-color:var(--bulk-line)}
  .bulk b{margin-right:4px}
  .item.na a.t{text-decoration:line-through;color:var(--na-ink);font-weight:500}
  .item.na .dday,.item.na .meta{opacity:.45}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12.5px;color:var(--sub);align-items:center}
  .b{border-radius:5px;padding:1px 7px;font-size:12px;background:var(--bg);color:var(--sub)}
  .b.type{background:var(--accent-soft);color:var(--accent)}
  .b.new{background:var(--green-soft);color:var(--green);font-weight:700}
  .b.on{background:var(--green-soft);color:var(--green)}
  .b.pin{background:var(--amber-soft);color:var(--amber)}
  .b.folder{background:var(--folder-bg);color:var(--folder-ink)}
  .dday{min-width:56px;text-align:center;font-weight:700;font-size:13px;border-radius:8px;padding:6px 4px;background:var(--bg);color:var(--sub)}
  .dday.urgent{background:var(--red-soft);color:var(--red)}
  .dday.soon{background:var(--amber-soft);color:var(--amber)}
  .dday.over{opacity:.5}
  .acts{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .acts select{font-size:12.5px;padding:4px 6px;max-width:130px}
  .acts .naBtn{font-size:12.5px;padding:4px 8px}
  .acts .naBtn.on{background:var(--red-soft);border-color:var(--red-soft);color:var(--red)}
  .note{margin-top:8px;font-size:13px;color:var(--note-ink);background:var(--amber-soft);border-radius:6px;padding:6px 10px;white-space:pre-wrap;cursor:pointer}
  .noteEdit{margin-top:8px;display:flex;gap:6px;align-items:flex-start}
  .noteEdit textarea{flex:1;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:54px;resize:vertical;background:var(--input);color:var(--ink)}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .sync{font-size:12px;color:var(--sub)}
  dialog{border:1px solid var(--line);border-radius:12px;max-width:460px;width:92%;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog input{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px;background:var(--input);color:var(--ink)}
  dialog p{font-size:13px;color:var(--sub);line-height:1.5}
  @media (max-width:640px){ .item{flex-wrap:wrap} .acts{width:100%;justify-content:flex-end} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>지원사업 공고 모니터</h1>
    <span class="upd" id="upd">불러오는 중...</span>
    <span class="spacer"></span>
    <span class="sync" id="sync"></span>
    <button id="btnRefresh" class="primary" title="GitHub Actions로 지금 수집">지금 갱신</button>
    <button id="btnTheme" class="themeBtn" title="다크/라이트 모드">🌙</button>
    <button id="btnSet" title="설정">⚙</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>

<dialog id="dlg">
  <h3 style="margin-top:0">설정</h3>
  <p>토큰을 넣으면 ① "지금 갱신" 버튼과 ② 폴더/메모를 저장소(<b>state.json</b>)에 저장해서 다른 기기에서도 똑같이 보이게 해. 토큰은 이 브라우저에만 저장돼.<br>
  Fine-grained token, 이 저장소만 선택, 권한 <b>Actions: Read and write</b>, <b>Contents: Read and write</b>.</p>
  <label>저장소 (owner/repo)</label>
  <input id="inRepo" placeholder="myname/support-monitor">
  <label>GitHub 토큰</label>
  <input id="inTok" type="password" placeholder="github_pat_...">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button id="dlgCancel">닫기</button>
    <button id="dlgSave" class="primary">저장</button>
  </div>
</dialog>

<script>
const SOURCES = {
  ripc:    { name: "특허 (RIPC)", home: "https://pms.ripc.org/pms/biz/applicant/notice/list.do", site: "ripc" },
  export:  { name: "수출바우처", home: "https://www.exportvoucher.com/portal/board/boardList?bbs_id=1", site: "export" },
  mssmiv:  { name: "혁신바우처", home: "https://www.mssmiv.com/portal/board/BoardList?bbsId=1", site: "mssmiv" },
  bizinfo: { name: "사업화 (기업마당·K-Startup)", home: "https://www.bizinfo.go.kr/sii/siia/selectSIIA200View.do", site: "bizinfo",
             homes: { bizinfo: "https://www.bizinfo.go.kr/sii/siia/selectSIIA200View.do", kstartup: "https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do" } },
};
// 사이트별 이름과 아이콘 (각 사이트 파비콘)
const SITES = {
  ripc:     { name: "RIPC", domain: "pms.ripc.org" },
  export:   { name: "수출바우처", domain: "www.exportvoucher.com" },
  mssmiv:   { name: "혁신바우처", domain: "www.mssmiv.com" },
  bizinfo:  { name: "기업마당", domain: "www.bizinfo.go.kr" },
  kstartup: { name: "K-Startup", domain: "www.k-startup.go.kr" },
};
const favicon = (site) => `<img class="fav" src="https://www.google.com/s2/favicons?domain=${SITES[site].domain}&sz=32" alt="" onerror="this.style.display='none'">`;
const NEW_DAYS = 3;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = (s) => String(s || "").replace(/\s+/g, "").toLowerCase();
const ls = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let DATA = null;

/* 화면 상태 (이 브라우저 전용) */
const view = ls.get("spm_view", null) || {
  tab: "ripc", folder: {}, q: "", center: "", activeOnly: true, hideNa: false,
};

/* 사용자 데이터 (폴더, 분류, 해당없음 메모) - localStorage + 저장소 state.json 동기화 */
let U = ls.get("spm_user", null) || { folders: { ripc: [], export: [], bizinfo: [] }, assign: {}, marks: {}, updatedAt: "" };
let editingNote = null; // "tab:id"
let selected = new Set(); // 다중 선택 (화면용, 저장 안 함)
let visibleKeys = [], lastSel = null;

const key = (tab, id) => `${tab}:${id}`;
const folderOf = (tab, it) => U.assign[key(tab, it.id)] || "";
const markOf = (tab, it) => U.marks[key(tab, it.id)];

function todayKST() {
  const d = new Date(Date.now() + 9 * 3600e3);
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
}
function dday(s) {
  if (!s) return null;
  const [y, m, d] = s.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - todayKST()) / 864e5);
}
const isNew = (it, tab = view.tab) => {
  const base = DATA?.sources?.[tab]?.baseline || "";
  if (!it.first_seen || it.first_seen <= base) return false; // 첫 수집분은 제외
  const n = dday(it.first_seen); return n !== null && n > -NEW_DAYS;
};
const ico = (f) => (f && f.icon) || "📁";
const B = (cls, t) => (t ? `<span class="b ${cls}">${esc(t)}</span>` : "");

function ddayBox(it) {
  const n = dday(it.deadline);
  if (n === null) return `<div class="dday">-</div>`;
  const cls = n < 0 ? "over" : n <= 3 ? "urgent" : n <= 7 ? "soon" : "";
  return `<div class="dday ${cls}">${n < 0 ? "마감" : n === 0 ? "D-day" : "D-" + n}</div>`;
}
function isClosed(it) {
  if (/종료|마감/.test(it.status || "")) return true;
  const n = dday(it.deadline);
  return n !== null && n < 0;
}
function badges(tab, it) {
  if (tab === "ripc") return [B("type", it.type), B("", it.center), B(/공고중|접수중/.test(it.status) ? "on" : "", it.status)];
  if (tab === "export" || tab === "mssmiv") return [it.notice ? B("pin", "공지") : "", B("type", it.type)];
  return [...(it.keywords || []).map((k) => B("type", k)), B("", it.type), B("", it.org)];
}

function card(tab, it, inFolderView) {
  const k = key(tab, it.id), mk = markOf(tab, it), fid = folderOf(tab, it);
  const folders = U.folders[tab] || [];
  const fobj = folders.find((f) => f.id === fid);
  const noteBox = editingNote === k
    ? `<div class="noteEdit"><textarea data-note="${esc(k)}" placeholder="해당 안 되는 이유 (예: 업력 7년 초과, 지역 불일치)">${esc(mk?.note || "")}</textarea>
        <div style="display:flex;flex-direction:column;gap:4px"><button class="primary" data-act="noteSave" data-k="${esc(k)}">저장</button><button data-act="noteCancel">취소</button></div></div>`
    : mk ? `<div class="note" data-act="noteEdit" data-k="${esc(k)}" title="클릭해서 메모 수정">해당없음${mk.note ? ": " + esc(mk.note) : ""}${mk.at ? ` <span style="opacity:.6">(${esc(mk.at)})</span>` : ""}</div>` : "";
  return `<div class="item ${mk ? "na" : ""} ${selected.has(k) ? "sel-on" : ""}" draggable="true" data-drag="${esc(k)}">
    <input type="checkbox" class="sel" data-sel="${esc(k)}" ${selected.has(k) ? "checked" : ""} title="선택 (Shift+클릭: 범위 선택)">
    ${ddayBox(it)}
    <div class="body">

function sortItems(arr) {
  const score = (it) => { const d = dday(it.deadline); return d === null ? 9999 : d < 0 ? 10000 - d : d; };
  return arr.sort((a, b) => {
    const ma = U.marks[key(view.tab, a.id)] ? 1 : 0, mb = U.marks[key(view.tab, b.id)] ? 1 : 0;
    if (ma !== mb) return ma - mb; // 해당없음은 아래로
    if (view.tab === "export" || view.tab === "mssmiv") return (b.notice - a.notice) || (b.date || "").localeCompare(a.date || "");
    return score(a) - score(b);
  });
}

function changed() {

function newFolder(tab) {
  const name = (prompt("새 폴더 이름 (예: IP나래, 긴급지원 경기)") || "").trim();
  if (!name) return null;
  const f = { id: "f" + Date.now().toString(36), name };
  (U.folders[tab] = U.folders[tab] || []).push(f);
  return f;
}

document.addEventListener("click", (e) => {
  const sc = e.target.closest?.("[data-sel]");
  if (sc) {
    const k = sc.dataset.sel, on = sc.checked;
    if (e.shiftKey && lastSel && visibleKeys.includes(lastSel)) {
      const [i, j] = [visibleKeys.indexOf(lastSel), visibleKeys.indexOf(k)].sort((x, y) => x - y);
      visibleKeys.slice(i, j + 1).forEach((x) => (on ? selected.add(x) : selected.delete(x)));
    } else on ? selected.add(k) : selected.delete(k);
    lastSel = k;
    return render();
  }
  const t = e.target.closest("[data-tab],[data-act]");
  if (!t || t.tagName === "SELECT" || t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
  const tab = view.tab, a = t.dataset.act;
  if (t.dataset.tab) { view.tab = t.dataset.tab; editingNote = null; selected.clear(); return render(); }
  if (a === "selClear") { selected.clear(); return render(); }
  if (a === "openF") { view.folder[tab] = t.dataset.f; editingNote = null; selected.clear(); return render(); }
  if (a === "addF") { const f = newFolder(tab); if (f) changed(); return; }
  if (a === "pickIcon") { e.stopPropagation(); return openPicker(t, t.dataset.f); }
  if (a === "upF" || a === "downF") {
    const arr = U.folders[tab], i = arr.findIndex((x) => x.id === t.dataset.f), j = i + (a === "upF" ? -1 : 1);
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return changed();
  }
  if (a === "renF") {
    const f = U.folders[tab].find((x) => x.id === t.dataset.f);
    const name = (prompt("폴더 이름", f.name) || "").trim();
    if (name) { f.name = name; changed(); }
    return;
  }
  if (a === "delF") {
    const f = U.folders[tab].find((x) => x.id === t.dataset.f);
    if (!confirm(`"${f.name}" 폴더를 삭제할까? 안의 공고는 미분류로 돌아가.`)) return;
    U.folders[tab] = U.folders[tab].filter((x) => x.id !== f.id);
    for (const k of Object.keys(U.assign)) if (U.assign[k] === f.id) delete U.assign[k];
    view.folder[tab] = "";
    return changed();
  }
  if (a === "na") {
    const k = t.dataset.k;
    if (U.marks[k]) { delete U.marks[k]; if (editingNote === k) editingNote = null; return changed(); }
    editingNote = k; return render();
  }
  if (a === "noteEdit") { editingNote = t.dataset.k; return render(); }
  if (a === "noteCancel") { editingNote = null; return render(); }
  if (a === "noteSave") {
    const k = t.dataset.k, ta = document.querySelector(`[data-note="${CSS.escape(k)}"]`);
    const d = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    U.marks[k] = { note: ta.value.trim(), at: U.marks[k]?.at || d };
    editingNote = null;
    return changed();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target, a = t.dataset.act;
  if (a === "selAll") { visibleKeys.forEach((k) => (t.checked ? selected.add(k) : selected.delete(k))); return render(); }
  if (a === "bulkMove") {
    let v = t.value;
    if (!v) return;
    if (v === "__new") { const f = newFolder(view.tab); if (!f) return render(); v = f.id; }
    selected.forEach((k) => { if (v === "__none") delete U.assign[k]; else U.assign[k] = v; });
    selected.clear();
    return changed();
  }
  if (a === "move") {
    let v = t.value;
    if (v === "__new") { const f = newFolder(view.tab); if (!f) return render(); v = f.id; }
    if (v) U.assign[t.dataset.k] = v; else delete U.assign[t.dataset.k];
    return changed();
  }
  if (a === "center") { view.center = t.value; return render(); }
  if (a === "activeOnly") { view.activeOnly = t.checked; return render(); }
  if (a === "hideNa") { view.hideNa = t.checked; return render(); }
});

function closePicker() { document.querySelector(".picker")?.remove(); }
function openPicker(anchor, fid) {

document.addEventListener("mousedown", (e) => { if (!e.target.closest(".picker, [data-act=pickIcon]")) closePicker(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePicker(); });
addEventListener("scroll", (e) => { const p = document.querySelector(".picker"); if (p && !p.contains(e.target)) closePicker(); }, true);

/* ───── 드래그해서 폴더로 이동 ───── */
let dragK = null, dragF = null;
const clearDnD = () => document.querySelectorAll(".dragging,.drop,.ins-before,.ins-after,.fdragging").forEach((el) => el.classList.remove("dragging", "drop", "ins-before", "ins-after", "fdragging"));
document.addEventListener("dragstart", (e) => {
  const fdEl = e.target.closest?.("[data-fdrag]");
  if (fdEl) { // 폴더 순서 바꾸기
    dragF = fdEl.dataset.fdrag; dragK = null;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "folder");
    fdEl.classList.add("fdragging");
    closePicker();
    return;
  }
  const it = e.target.closest?.("[data-drag]");
  if (!it) return;
  dragK = it.dataset.drag; dragF = null;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragK);
  it.classList.add("dragging");
  if (selected.has(dragK) && selected.size > 1) {
    const g = document.createElement("div");
    g.textContent = `${selected.size}개 이동`;
    g.style.cssText = "position:fixed;top:-100px;padding:6px 12px;background:#2f5bea;color:#fff;border-radius:8px;font:600 13px Pretendard,sans-serif";
    document.body.appendChild(g); e.dataTransfer.setDragImage(g, 10, 10); setTimeout(() => g.remove(), 0);
    document.querySelectorAll(".item.sel-on").forEach((x) => x.classList.add("dragging"));
  }
});
document.addEventListener("dragend", () => { dragK = null; dragF = null; clearDnD(); });
document.addEventListener("dragover", (e) => {
  const t = e.target.closest?.("[data-drop]");
  if (!t) return;
  if (dragF) {
    const fid = t.dataset.drop;
    if (!fid || fid === dragF) return;
    e.preventDefault();
    const r = t.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    document.querySelectorAll(".ins-before,.ins-after").forEach((el) => el.classList.remove("ins-before", "ins-after"));
    t.classList.add(after ? "ins-after" : "ins-before");
    return;
  }
  if (!dragK) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop").forEach((el) => el !== t && el.classList.remove("drop"));
  t.classList.add("drop");
});
document.addEventListener("dragleave", (e) => {
  const t = e.target.closest?.("[data-drop]");
  if (t && !t.contains(e.relatedTarget)) t.classList.remove("drop", "ins-before", "ins-after");
});
document.addEventListener("drop", (e) => {
  const t = e.target.closest?.("[data-drop]");
  if (!t) return;
  const fid = t.dataset.drop;
  if (dragF) {
    e.preventDefault();
    const arr = U.folders[view.tab], from = arr.findIndex((x) => x.id === dragF);
    const r = t.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    if (from < 0 || !fid || fid === dragF) return;
    const [moved] = arr.splice(from, 1);
    let to = arr.findIndex((x) => x.id === fid) + (after ? 1 : 0);
    arr.splice(to, 0, moved);
    dragF = null; clearDnD();
    return changed();
  }
  if (!dragK) return;
  e.preventDefault();
  const keys = selected.has(dragK) ? [...selected] : [dragK];
  keys.forEach((k) => { if (fid) U.assign[k] = fid; else delete U.assign[k]; });
  if (selected.has(dragK)) selected.clear();
  dragK = null;
  changed();
});

/* ───── GitHub 연동 ───── */
function cfg() {
  let repo = ls.get("spm_repo", "") || "";
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (!repo && m) repo = `${m[1]}/${location.pathname.split("/").filter(Boolean)[0] || m[1] + ".github.io"}`;
  return { repo, tok: ls.get("spm_tok", "") || "" };
}
const gh = (path, opt = {}) => {
  const { repo, tok } = cfg();
  return fetch(`https://api.github.com/repos/${repo}/${path}`, {
    ...opt, cache: "no-store",
    headers: { Authorization: `Bearer ${tok}`, Accept: "application/vnd.github+json", ...(opt.headers || {}) },
  });
};
const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
let stateSha = null, syncTimer = null;
const setSync = (t) => ($("#sync").textContent = t);

async function pullState() {
  const { tok } = cfg();
  if (!tok) { // 토큰 없으면 Pages에 올라간 state.json을 읽기만 함
    try {
      const r = await fetch(`state.json?t=${Date.now()}`, { cache: "no-store" });
      if (r.ok) {
        const remote = await r.json();
        if ((remote.updatedAt || "") > (U.updatedAt || "")) { U = remote; ls.set("spm_user", U); }
      }
    } catch (e) {}
    setSync("보기만 동기화 (수정하려면 ⚙ 토큰)");
    return;
  }
  try {
    const r = await gh(`contents/state.json?t=${Date.now()}`);
    if (r.status === 404) { stateSha = null; setSync("동기화 준비됨"); if (U.updatedAt) scheduleSync(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    stateSha = j.sha;
    const remote = JSON.parse(unb64(j.content));
    if ((remote.updatedAt || "") >= (U.updatedAt || "")) { U = remote; ls.set("spm_user", U); }
    else scheduleSync();
    setSync("동기화됨");
  } catch (e) { setSync("동기화 실패 (토큰 권한 확인)"); }
}
function scheduleSync() {
  if (!cfg().tok) { setSync("이 브라우저에만 저장됨 (⚙ 토큰 넣으면 동기화)"); return; }
  setSync("저장 중...");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushState, 1200);
}
async function pushState(retry = true) {
  try {
    const body = { message: "state: 폴더/메모 저장", content: b64(JSON.stringify(U, null, 1)) };
    if (stateSha) body.sha = stateSha;
    const r = await gh("contents/state.json", { method: "PUT", body: JSON.stringify(body) });
    if ((r.status === 409 || r.status === 422) && retry) {
      const g = await gh(`contents/state.json?t=${Date.now()}`);
      stateSha = g.ok ? (await g.json()).sha : null;
      return pushState(false);
    }
    if (!r.ok) throw new Error(r.status);
    stateSha = (await r.json()).content.sha;
    setSync("동기화됨");
  } catch (e) { setSync("저장소 저장 실패 (브라우저엔 저장됨)"); }
}

function migrateAltIds() {
  let moved = false;
  for (const [tab, src] of Object.entries(DATA.sources || {})) {
    for (const it of src.items || []) {
      for (const alt of it.alt_ids || []) {
        const ak = key(tab, alt), k = key(tab, it.id);
        if (U.assign[ak]) { if (!U.assign[k]) U.assign[k] = U.assign[ak]; delete U.assign[ak]; moved = true; }
        if (U.marks[ak]) { if (!U.marks[k]) U.marks[k] = U.marks[ak]; delete U.marks[ak]; moved = true; }
      }
    }
  }
  if (moved) { U.updatedAt = new Date().toISOString(); ls.set("spm_user", U); scheduleSync(); }
}

async function loadData() {
  const { repo, tok } = cfg();
  try {
    let res;
    if (tok && repo) res = await gh(`contents/data.json?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!res || !res.ok) res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    DATA = await res.json();
    migrateAltIds();
    render();
  } catch (e) {
    $("#upd").textContent = "data.json을 불러오지 못했어 (첫 수집 전일 수 있음)";
  }
}

function applyThemeBtn() { $("#btnTheme").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙"; }
$("#btnTheme").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; ls.set("spm_theme", t); applyThemeBtn();
};
applyThemeBtn();
$("#btnSet").onclick = () => { const c = cfg(); $("#inRepo").value = c.repo; $("#inTok").value = c.tok; $("#dlg").showModal(); };
$("#dlgCancel").onclick = () => $("#dlg").close();
$("#dlgSave").onclick = async () => {
  ls.set("spm_repo", $("#inRepo").value.trim()); ls.set("spm_tok", $("#inTok").value.trim());
  $("#dlg").close();
  await pullState(); await loadData();
};
$("#btnRefresh").onclick = async () => {
  const { repo, tok } = cfg(), btn = $("#btnRefresh");
  if (!tok || !repo) return $("#btnSet").click();
  btn.disabled = true; btn.textContent = "수집 요청 중...";
  const before = DATA?.updated;
  try {
    const r = await gh("actions/workflows/update.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: "main" }) });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    btn.textContent = "수집 중 (1~2분)...";
    for (let i = 0; i < 20; i++) {
      await new Promise((ok) => setTimeout(ok, 15000));
      await loadData();
      if (DATA?.updated !== before) break;
    }
  } catch (e) { $("#upd").textContent = "갱신 실패: " + e.message.slice(0, 120); }
  btn.disabled = false; btn.textContent = "지금 갱신";
};

(async () => { await pullState(); await loadData(); })();

// 다른 컴퓨터에서 바꾼 내용 반영: 탭으로 돌아오면 다시 불러옴
let lastPull = Date.now();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || Date.now() - lastPull < 20000) return;
  if (editingNote || selected.size || syncTimer && $("#sync").textContent === "저장 중...") return;
  lastPull = Date.now();
  await pullState(); render();
});
</script>
</body>
</html>
